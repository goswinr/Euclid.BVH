name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
           dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests .NET
        run: dotnet run --project ./Test/Test.fsproj
